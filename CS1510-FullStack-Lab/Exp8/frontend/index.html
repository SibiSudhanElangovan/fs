<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Leave Management System</title><style>
*{box-sizing:border-box}body{margin:0;padding:28px;background:#f1f5f9;color:#1e293b;font-family:Arial,sans-serif}.container{max-width:760px;margin:auto}.card{margin:18px 0;padding:24px;background:white;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 5px 18px #0f172a0a}h1,h2{color:#1e40af}label{display:block;margin:12px 0;font-weight:600}input,select{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer}.result{margin-top:14px;line-height:1.7}.status{min-height:24px;color:#166534}.error{color:#b42318}
</style></head><body><main class="container"><h1>Employee Leave Management</h1><section class="card"><h2>Apply for Leave</h2><form id="leaveForm"><label>Employee ID<input type="text" id="empId" required maxlength="40"></label><label>Leave Type<select id="type"><option value="Casual">Casual</option><option value="Medical">Medical</option></select></label><label>Number of Days<input type="number" id="days" min="1" max="30" step="1" required></label><button type="submit">Apply Leave</button></form><p id="applyStatus" class="status" role="status"></p></section><section class="card"><h2>Check Leave Balance</h2><form id="balanceForm"><label>Employee ID<input type="text" id="checkId" required maxlength="40"></label><button type="submit">Check Balance</button></form><div id="result" class="result" aria-live="polite"></div></section></main><script>
const API='/api/leaves';
document.getElementById('leaveForm').addEventListener('submit',async(event)=>{event.preventDefault();const status=document.getElementById('applyStatus');status.className='status';status.textContent='Submitting...';try{const response=await fetch(`${API}/apply`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employeeId:document.getElementById('empId').value.trim(),type:document.getElementById('type').value,days:Number(document.getElementById('days').value)})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to apply.');status.textContent=data.message;document.getElementById('checkId').value=document.getElementById('empId').value.trim();}catch(error){status.className='status error';status.textContent=error.message;}});
document.getElementById('balanceForm').addEventListener('submit',async(event)=>{event.preventDefault();const result=document.getElementById('result');result.textContent='Loading...';try{const id=encodeURIComponent(document.getElementById('checkId').value.trim());const response=await fetch(`${API}/balance/${id}`);const data=await response.json();if(!response.ok)throw new Error(data.message||'Unable to retrieve balance.');result.innerHTML=`<strong>Employee:</strong> ${escapeHtml(data.employeeId)}<br><strong>Casual:</strong> ${data.Casual.remaining} remaining / ${data.Casual.total} total (${data.Casual.used} used)<br><strong>Medical:</strong> ${data.Medical.remaining} remaining / ${data.Medical.total} total (${data.Medical.used} used)`;}catch(error){result.textContent=error.message;}});
function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
</script></body></html>
